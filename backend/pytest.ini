[pytest]
# ── Discovery ────────────────────────────────────────────────────────────────
testpaths = tests

# ── Python path ──────────────────────────────────────────────────────────────
# Makes `from app.xxx import yyy` work without installing the package.
pythonpath = .

# ── pytest-asyncio ───────────────────────────────────────────────────────────
# "auto" lets async fixtures work without explicit @pytest.mark.asyncio on
# each fixture definition, while explicit @pytest.mark.asyncio on every
# test function satisfies the test-suite requirement.
asyncio_mode = auto

# ── Output ───────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:warnings

# ── Custom markers ───────────────────────────────────────────────────────────
markers =
    asyncio: marks tests as async (auto-applied by pytest-asyncio)
    slow: marks tests that are expected to be slow (deselect with -m "not slow")
    integration: marks tests that require external services
